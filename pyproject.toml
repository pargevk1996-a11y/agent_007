[project]
name = "researchmind"
version = "0.1.0"
description = "A research agent that answers open-ended questions with a report you can check."
readme = "README.md"
requires-python = "==3.12.*"

# Exact pins on purpose: uv.lock fixes the resolved graph, and `==` here makes every
# upgrade an explicit, reviewable edit rather than a silent `uv lock --upgrade` drift.
#
# Leaf dependencies that constrain nothing else in the graph are declared in the phase
# that first imports them: trafilatura and pypdf (phase 5, 12), tree-sitter (phase 12),
# vcrpy (phase 5). Everything below participates in version resolution, so it is
# declared now to surface conflicts while they are still cheap to fix.
dependencies = [
  # typed contracts
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  # llm providers and structured output
  "anthropic==0.120.1",
  "openai==2.49.0",
  "instructor==1.15.4",
  # data services
  "asyncpg==0.31.0",
  "redis==8.0.1",
  "qdrant-client==1.18.0",
  # http and control plane
  "httpx==0.28.1",
  "fastapi==0.140.13",
  "uvicorn[standard]==0.51.0",
  "sse-starlette==3.4.6",
  # observability
  "structlog==26.1.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-instrumentation-asyncpg==0.65b0",
  # identifiers: UUIDv7 until it lands in the stdlib in python 3.14
  "uuid-utils==0.17.0",
  # entrypoints for the worker and the migration runner
  "typer==0.27.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "ruff==0.16.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.163.0",
  "testcontainers==4.15.0",
  "respx==0.23.1",
  "import-linter==2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the package sits at the repository root, so the backend is told
# explicitly rather than left to guess.
[tool.hatch.build.targets.wheel]
packages = ["researchmind"]


# --------------------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F",      # pycodestyle, pyflakes
  "I",                # import sorting
  "N",                # pep8 naming
  "UP",               # pyupgrade: no legacy typing syntax
  "D",                # docstrings: every module states its role
  "ANN",              # every signature is annotated, including against bare Any
  "ASYNC",            # blocking calls inside async functions
  "S",                # bandit
  "B", "A", "C4", "SIM", "RUF",
  "DTZ",              # no naive datetimes: every timestamp is tz-aware
  "T20",              # no print: logging is structured
  "PT",               # pytest style
  "TID",              # tidy imports
  "ARG",              # unused arguments
  "PL",               # pylint subset
]
ignore = [
  "D203",  # conflicts with D211 (no blank line before class docstring)
  "D213",  # conflicts with D212 (summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert, and their fixtures do not need prose.
"tests/**" = ["S101", "PLR2004", "D100", "D103"]


# --------------------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true


# --------------------------------------------------------------------------------------
# import-linter: the dependency layering described in README.md, made enforceable
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "researchmind"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point downward only"
type = "layers"
layers = [
  "researchmind.api : researchmind.worker",
  "researchmind.planner : researchmind.executor : researchmind.critic : researchmind.synthesizer",
  "researchmind.memory : researchmind.tools",
  "researchmind.providers : researchmind.budget",
  "researchmind.events",
  "researchmind.storage",
  "researchmind.core",
]

[[tool.importlinter.contracts]]
name = "Vendor SDKs are confined to providers"
type = "forbidden"
source_modules = [
  "researchmind.core", "researchmind.budget", "researchmind.tools",
  "researchmind.memory", "researchmind.planner", "researchmind.executor",
  "researchmind.critic", "researchmind.synthesizer", "researchmind.storage",
  "researchmind.events", "researchmind.obs", "researchmind.config",
  "researchmind.api", "researchmind.worker", "researchmind.sdk",
]
forbidden_modules = ["anthropic", "openai", "instructor"]

[[tool.importlinter.contracts]]
name = "Database access is confined to storage"
source_modules = [
  "researchmind.core", "researchmind.providers", "researchmind.budget",
  "researchmind.tools", "researchmind.memory", "researchmind.planner",
  "researchmind.executor", "researchmind.critic", "researchmind.synthesizer",
  "researchmind.obs", "researchmind.config", "researchmind.sdk",
]
type = "forbidden"
forbidden_modules = ["asyncpg"]

[[tool.importlinter.contracts]]
name = "core is the foundation and imports nothing of ours"
type = "forbidden"
source_modules = ["researchmind.core"]
forbidden_modules = ["researchmind.config", "researchmind.obs"]

[[tool.importlinter.contracts]]
name = "Cross-cutting packages stay cross-cutting"
type = "forbidden"
source_modules = ["researchmind.config", "researchmind.obs"]
forbidden_modules = [
  "researchmind.providers", "researchmind.budget", "researchmind.tools",
  "researchmind.memory", "researchmind.planner", "researchmind.executor",
  "researchmind.critic", "researchmind.synthesizer", "researchmind.storage",
  "researchmind.events", "researchmind.api", "researchmind.worker",
]


# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: needs real services, started through testcontainers",
  "e2e: replays recorded LLM and tool cassettes end to end",
]
