# Development dependencies only.
#
# The application services (api, worker) join this file in the phase that gives them an
# entrypoint. A Dockerfile with nothing to run is a promise the repository cannot keep.
#
# Every port is published on the loopback interface: these containers are reachable from
# this machine and from nowhere else. Host ports are overridable because a developer
# machine often already runs a postgres on 5432.

name: researchmind

services:
  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchmind}
      POSTGRES_DB: ${POSTGRES_DB:-researchmind}
      # Byte-order collation, chosen deliberately: it is deterministic, it cannot be
      # invalidated by a glibc upgrade underneath a running index, and it lets a plain
      # LIKE 'prefix%' use a b-tree index. Linguistic ordering, if it is ever needed,
      # is asked for explicitly with COLLATE at the column or query level.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      # Every timestamp this system stores is tz-aware and in UTC; the server agrees.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker defaults /dev/shm to 64MB, which parallel query workers outgrow with a
    # confusing "could not resize shared memory segment" error.
    shm_size: 256mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    # The image ships bash but neither curl nor wget, so readiness is checked over a
    # raw socket. It asserts the /readyz body rather than a merely open port: qdrant
    # accepts connections before its shards are loaded.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "all shards are ready" <&3'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.6.5-alpine
    # No persistence, on purpose. Redis carries only the hot tail of the event stream;
    # PostgreSQL is the source of truth and a reconnecting client re-reads what it
    # missed from there. Losing this container loses nothing, so it is configured to
    # make that fact obvious rather than to paper over it.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-researchmind}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-researchmind}
      TZ: UTC
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
  qdrantdata:
  # Redis has no volume. See the note on its command above.
